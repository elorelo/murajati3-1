<style>
:root{--bg:#0b1020;--panel:#141c31;--panel2:#1b2740;--text:#f4f6ff;--muted:#aab5ce;--accent:#9b8cff;--line:#2c3956;--green:#75d6ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c2850 0,#0b1020 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{padding:34px 20px 22px;text-align:center}h1{margin:0;font-size:clamp(27px,5vw,42px)}header p{color:var(--muted);margin:8px auto;max-width:650px}
main{max-width:1400px;margin:auto;padding:0 18px 50px}
button,select{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:var(--panel2);color:var(--text)}
button.active{background:var(--accent);color:#101329;border-color:transparent;font-weight:bold}
.app-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}
.sidebar{background:rgba(20,28,49,.92);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.side-label{font-size:12px;color:var(--muted);font-weight:bold;margin:2px 8px 10px}
.subject-nav,.lesson-nav{display:flex;flex-direction:column;gap:7px}
.subject-nav button,.lesson-nav button{text-align:right;width:100%;display:flex;align-items:center;gap:10px;background:transparent;border-color:transparent}
.subject-nav button.active,.lesson-nav button.active{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:inset -3px 0 var(--accent)}
.subject-nav button span{font-size:18px}
.lesson-nav button{font-size:13px;color:var(--muted);padding:8px 11px}
.side-divider{height:1px;background:var(--line);margin:17px 0}
.content-area{min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{flex:1;min-width:180px}
@media(max-width:760px){.app-layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.subject-nav{display:grid;grid-template-columns:repeat(3,1fr)}.subject-nav button{justify-content:center;font-size:13px;padding:9px 5px}.lesson-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-nav button{font-size:12px}.content-area{width:100%}}
input{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel);color:var(--text)}
.subject-title{font-size:24px;margin:12px 0 4px}.hint{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.card{background:linear-gradient(145deg,var(--panel),#111a2d);border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:9px}
.tag{color:var(--accent);font-size:13px}.card h3{margin:0;font-size:18px}.formula{font-family:Georgia,serif;direction:ltr;text-align:center;background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:20px;overflow-wrap:anywhere}
.example{color:var(--muted);font-size:14px;min-height:46px}.result{background:#102b2a;border:1px solid #28584d;border-radius:12px;padding:11px;color:#d7fff0;display:none;white-space:pre-line}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions button{flex:1}.small{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:35px}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
</style>
</head>

const D=[
{ s:'chem',c:'المخاليط والمحاليل',n:'النسبة المئوية الكتلية',f:'% الكتلة = (كتلة المذاب ÷ كتلة المحلول) × 100',g:()=>{let a=r(5,35),b=a+r(80,250);return [`مذاب كتلته ${a} g ومحلول كتلته ${b} g. احسب النسبة الكتلية.`,`(${a} ÷ ${b}) × 100 = ${(a/b*100).toFixed(2)}%`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'النسبة المئوية الحجمية',f:'% الحجم = (حجم المذاب ÷ حجم المحلول) × 100',g:()=>{let a=r(5,40),b=a+r(60,180);return [`حجم المذاب ${a} mL وحجم المحلول ${b} mL.`,`(${a} ÷ ${b}) × 100 = ${(a/b*100).toFixed(2)}%`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'المولارية',f:'M = n ÷ V',g:()=>{let n=+(r(1,8)/2).toFixed(1),v=+(r(2,10)/10).toFixed(1);return [`عدد المولات ${n} mol وحجم المحلول ${v} L. احسب M.`,`M = ${n} ÷ ${v} = ${(n/v).toFixed(2)} mol/L`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'عدد المولات',f:'n = m ÷ MM',g:()=>{let mm=r(20,180),n=r(1,5);return [`كتلة مادة ${n*mm} g وكتلتها المولية ${mm} g/mol.`,`n = ${n*mm} ÷ ${mm} = ${n} mol`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'التخفيف',f:'M₁V₁ = M₂V₂',g:()=>{let m1=r(4,10),v1=r(10,50),m2=2;let v2=m1*v1/m2;return [`محلول تركيزه ${m1} M وحجمه ${v1} mL خُفف إلى ${m2} M. احسب الحجم النهائي.`,`V₂ = (${m1} × ${v1}) ÷ ${m2} = ${v2} mL`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'التركيز بوحدة ppm',f:'ppm = (كتلة المذاب ÷ كتلة المحلول) × 10⁶',g:()=>{let a=r(2,20),b=1000000;return [`كتلة المذاب ${a} mg في ${b} mg من المحلول.`,`ppm = (${a} ÷ ${b}) × 10⁶ = ${a} ppm`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'المولالية',f:'m = مولات المذاب ÷ كتلة المذيب (kg)',g:()=>{let n=+(r(2,12)/2).toFixed(1),kg=+(r(2,10)/10).toFixed(1);return [`عدد المولات ${n} mol وكتلة المذيب ${kg} kg.`,`m = ${n} ÷ ${kg} = ${(n/kg).toFixed(2)} mol/kg`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'ارتفاع درجة الغليان',f:'ΔTb = i Kb m',g:()=>{let i=r(1,3),k=+(r(5,20)/10).toFixed(1),m=+(r(2,10)/10).toFixed(1);return [`i=${i} و Kb=${k} و m=${m}. احسب ΔTb.`,`ΔTb = ${i} × ${k} × ${m} = ${(i*k*m).toFixed(2)} °C`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'انخفاض درجة التجمد',f:'ΔTf = i Kf m',g:()=>{let i=r(1,3),k=+(r(5,20)/10).toFixed(1),m=+(r(2,10)/10).toFixed(1);return [`i=${i} و Kf=${k} و m=${m}. احسب ΔTf.`,`ΔTf = ${i} × ${k} × ${m} = ${(i*k*m).toFixed(2)} °C`]}},
{ s:'chem',c:'المخاليط والمحاليل',n:'الضغط الأسموزي',f:'π = i M R T',g:()=>{let i=r(1,2),M=+(r(1,5)/10).toFixed(1),T=r(280,310),R=.0821;return [`i=${i}، M=${M} mol/L، T=${T} K، واستخدم R=0.0821 L·atm/(mol·K).`,`π = ${i} × ${M} × 0.0821 × ${T} = ${(i*M*R*T).toFixed(2)} atm`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'الرقم الهيدروجيني',f:'pH = −log[H₃O⁺]',g:()=>{let p=r(2,6),x=Math.pow(10,-p);return [`تركيز أيون الهيدرونيوم ${x.toExponential(0)} M.`,`pH = −log(${x.toExponential(0)}) = ${p}`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'الرقم الهيدروكسيدي',f:'pOH = −log[OH⁻]',g:()=>{let p=r(2,6),x=Math.pow(10,-p);return [`تركيز OH⁻ يساوي ${x.toExponential(0)} M.`,`pOH = −log(${x.toExponential(0)}) = ${p}`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'العلاقة بين pH و pOH',f:'pH + pOH = 14 (عند 25°C)',g:()=>{let p=r(2,12);return [`إذا كان pH = ${p}، احسب pOH.`,`pOH = 14 − ${p} = ${14-p}`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'ثابت تأين الماء',f:'Kw = [H₃O⁺][OH⁻]',g:()=>{let a=1e-7,b=1e-7;return [`[H₃O⁺]=10⁻⁷ و [OH⁻]=10⁻⁷ M.`,`Kw = 10⁻⁷ × 10⁻⁷ = 1×10⁻¹⁴`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'ثابت تأين الحمض',f:'Ka = ([H₃O⁺][A⁻]) ÷ [HA]',g:()=>{let a=2e-3,b=2e-3,c=.1;return [`[H₃O⁺]=${a}، [A⁻]=${b}، [HA]=${c} mol/L.`,`Ka = (${a} × ${b}) ÷ ${c} = ${(a*b/c).toExponential(2)}`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'ثابت تأين القاعدة',f:'Kb = ([BH⁺][OH⁻]) ÷ [B]',g:()=>{let a=1e-3,b=1e-3,c=.2;return [`[BH⁺]=${a}، [OH⁻]=${b}، [B]=${c} mol/L.`,`Kb = (${a} × ${b}) ÷ ${c} = ${(a*b/c).toExponential(2)}`]}},
{ s:'chem',c:'الأحماض والقواعد',n:'ثابتا الحمض والقاعدة المرافقين',f:'Ka × Kb = Kw',g:()=>{let ka=1e-5;return [`Ka=${ka.toExponential(0)} و Kw=1×10⁻¹⁴. احسب Kb.`,`Kb = Kw ÷ Ka = 1×10⁻¹⁴ ÷ ${ka.toExponential(0)} = ${(1e-14/ka).toExponential(0)}`]}},
{ s:'chem',c:'الكيمياء الكهربائية',n:'جهد الخلية',f:'Ecell = Eالكاثود − Eالأنود',g:()=>{let a=0;return [`جهد اختزال الكاثود +0.80 V والأنود −0.30 V.`,`Ecell = 0.80 − (−0.30) = 1.10 V`]}},
{ s:'chem',c:'الكيمياء الكهربائية',n:'الطاقة الحرة',f:'ΔG = −n F Ecell',g:()=>{let n=r(1,3),e=+(r(5,15)/10).toFixed(1),F=96485;return [`n=${n} mol إلكترونات و Ecell=${e} V.`,`ΔG = −${n} × 96485 × ${e} = ${(-n*F*e).toFixed(0)} J`]}},
{ s:'chem',c:'الكيمياء الكهربائية',n:'قانون فاراداي',f:'m = (I t M) ÷ (n F)',g:()=>{let I=r(1,4),t=600,M=63.5,n=2,F=96485;return [`I=${I} A، t=${t} s، M=${M} g/mol، n=${n}.`,`m = (${I} × ${t} × ${M}) ÷ (${n} × 96485) = ${(I*t*M/(n*F)).toFixed(3)} g`]}},
{ s:'phys',c:'حالات المادة',n:'الكثافة',f:'ρ = m ÷ V',g:()=>{let v=r(2,8),rho=r(2,10);return [`كتلة جسم ${rho*v} kg وحجمه ${v} m³.`,`ρ = ${rho*v} ÷ ${v} = ${rho} kg/m³`]}},
{ s:'phys',c:'حالات المادة',n:'الضغط',f:'P = F ÷ A',g:()=>{let a=+(r(2,8)/10).toFixed(1),f=r(20,100);return [`قوة ${f} N تؤثر على مساحة ${a} m².`,`P = ${f} ÷ ${a} = ${(f/a).toFixed(2)} Pa`]}},
{ s:'phys',c:'حالات المادة',n:'ضغط السائل',f:'P = ρ g h',g:()=>{let rho=1000,h=+(r(1,8)/2).toFixed(1);return [`ماء كثافته 1000 kg/m³ وعمق النقطة ${h} m، g=9.8.`,`P = 1000 × 9.8 × ${h} = ${(1000*9.8*h).toFixed(0)} Pa`]}},
{ s:'phys',c:'حالات المادة',n:'مبدأ باسكال',f:'F₁ ÷ A₁ = F₂ ÷ A₂',g:()=>{let f1=20,a1=2,a2=10;return [`F₁=${f1} N، A₁=${a1} cm²، A₂=${a2} cm².`,`F₂ = (F₁ × A₂) ÷ A₁ = (${f1} × ${a2}) ÷ ${a1} = ${f1*a2/a1} N`]}},
{ s:'phys',c:'حالات المادة',n:'قوة الطفو',f:'FB = ρالسائل g Vالمزاح',g:()=>{let rho=1000,v=.003;return [`جسم أزاح ${v} m³ من الماء، g=9.8.`,`FB = 1000 × 9.8 × ${v} = ${(rho*9.8*v).toFixed(2)} N`]}},
{ s:'phys',c:'حالات المادة',n:'معادلة الاستمرارية',f:'A₁v₁ = A₂v₂',g:()=>{let a1=4,v1=3,a2=2;return [`A₁=${a1} cm²، v₁=${v1} m/s، A₂=${a2} cm².`,`v₂ = (${a1} × ${v1}) ÷ ${a2} = ${a1*v1/a2} m/s`]}},
{ s:'phys',c:'حالات المادة',n:'مبدأ برنولي',f:'P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂',g:()=>{let p1=100000,rho=1000,v1=2,v2=4,h1=0,h2=0;return [`أفقي: P₁=${p1} Pa، ρ=${rho}، v₁=${v1} m/s، v₂=${v2} m/s.`,`P₂ = P₁ + ½ρ(v₁²−v₂²) = ${p1} + 500(4−16) = ${p1-6000} Pa`]}},
{ s:'phys',c:'حالات المادة',n:'الإجهاد',f:'الإجهاد = F ÷ A',g:()=>{let f=200,a=.01;return [`قوة ${f} N على مساحة ${a} m².`,`الإجهاد = ${f} ÷ ${a} = ${(f/a).toLocaleString('en-US')} Pa`]}},
{ s:'phys',c:'حالات المادة',n:'الانفعال',f:'الانفعال = ΔL ÷ L₀',g:()=>{let d=.002,L=2;return [`استطالة ${d} m وطول أصلي ${L} m.`,`الانفعال = ${d} ÷ ${L} = ${(d/L).toFixed(4)}`]}},
{ s:'phys',c:'حالات المادة',n:'معامل يونغ',f:'Y = الإجهاد ÷ الانفعال',g:()=>{let s=2e6,e=.001;return [`الإجهاد ${s.toExponential(0)} Pa والانفعال ${e}.`,`Y = ${s.toExponential(0)} ÷ ${e} = ${(s/e).toExponential(2)} Pa`]}},
{ s:'phys',c:'الاهتزازات والموجات',n:'الزمن الدوري',f:'T = t ÷ N',g:()=>{let t=20,N=10;return [`حدثت ${N} اهتزازات خلال ${t} s.`,`T = ${t} ÷ ${N} = ${t/N} s`]}},
{ s:'phys',c:'الاهتزازات والموجات',n:'التردد',f:'f = 1 ÷ T',g:()=>{let T=+(r(2,10)/10).toFixed(1);return [`الزمن الدوري ${T} s.`,`f = 1 ÷ ${T} = ${(1/T).toFixed(2)} Hz`]}},
{ s:'phys',c:'الاهتزازات والموجات',n:'سرعة الموجة',f:'v = f λ',g:()=>{let f=r(2,10),l=+(r(2,10)/2).toFixed(1);return [`تردد موجة ${f} Hz وطولها الموجي ${l} m.`,`v = ${f} × ${l} = ${(f*l).toFixed(2)} m/s`]}},
{ s:'phys',c:'الاهتزازات والموجات',n:'عدد الاهتزازات',f:'N = f t',g:()=>{let f=5,t=12;return [`تردد الاهتزاز ${f} Hz والزمن ${t} s.`,`N = ${f} × ${t} = ${f*t} اهتزازة`]}},
{ s:'phys',c:'الصوت',n:'مستوى شدة الصوت',f:'β = 10 log(I ÷ I₀)',g:()=>{let ratio=Math.pow(10,r(2,5));return [`إذا كانت I/I₀ = ${ratio.toExponential(0)}.`,`β = 10 log(${ratio.toExponential(0)}) = ${10*Math.log10(ratio)} dB`]}},
{ s:'phys',c:'الصوت',n:'تردد الرنين لأنبوب مفتوح',f:'fₙ = n v ÷ 2L',g:()=>{let n=1,v=340,L=.5;return [`أنبوب مفتوح طوله ${L} m وسرعة الصوت ${v} m/s، والنغمة الأساسية n=1.`,`f₁ = 1 × ${v} ÷ (2 × ${L}) = ${v/(2*L)} Hz`]}},

{ s:'phys',c:'الضوء',n:'سرعة الضوء والطول الموجي',f:'c = f λ',g:()=>{let f=6e14,c=3e8;return [`تردد الضوء ${f.toExponential(0)} Hz وسرعته ${c.toExponential(0)} m/s.`,`λ = c ÷ f = ${(c/f).toExponential(2)} m`]}},
{ s:'phys',c:'المرايا',n:'قانون الانعكاس',f:'θᵢ = θᵣ',g:()=>{let a=r(15,70);return [`زاوية السقوط ${a}°، احسب زاوية الانعكاس.`,`θᵣ = θᵢ = ${a}°`]}},
{ s:'phys',c:'المرايا والعدسات',n:'معادلة المرايا والعدسات',f:'1/f = 1/do + 1/di',g:()=>{let f=10,do_=20;let di=1/(1/f-1/do_);return [`البعد البؤري ${f} cm وبعد الجسم ${do_} cm.`,`1/di = 1/f − 1/do = 1/${f} − 1/${do_}، إذن di = ${di} cm`]}},

function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
const titles={chem:'الكيمياء',phys:'الفيزياء',math:'الرياضيات'};
let current='chem';
const cards=document.getElementById('cards'),search=document.getElementById('search'),lessonNav=document.getElementById('lessonNav');
let activeLesson='';
function chapters(){let cs=[...new Set(D.filter(x=>x.s===current).map(x=>x.c))];if(!activeLesson||!cs.includes(activeLesson))activeLesson='';lessonNav.innerHTML=cs.map(x=>`<button data-lesson="${x}" class="${activeLesson===x?'active':''}">${x}</button>`).join('');lessonNav.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeLesson=b.dataset.lesson;chapters();render()})}
function render(){let q=search.value.trim().toLowerCase(),ch=activeLesson;let items=D.filter(x=>x.s===current&&(!ch||x.c===ch)&&(!q||(x.n+x.c+x.f).toLowerCase().includes(q)));cards.innerHTML='';if(!items.length){cards.innerHTML='<div class="empty">ما لقينا قانون بهذا الاسم.</div>';return}
items.forEach((x,i)=>{let id='ex'+i;let el=document.createElement('article');el.className='card';el.innerHTML=`<span class="tag">${x.c}</span><h3>${x.n}</h3><div class="formula">${x.f}</div><div class="example">ولّد مثالًا بأرقام جديدة لهذا القانون.</div><div class="result" id="${id}"></div><div class="actions"><button class="new">مثال جديد</button><button class="show">إظهار الحل</button></div>`;let data=null;el.querySelector('.new').onclick=()=>{data=x.g();el.querySelector('.example').textContent=data[0];let box=el.querySelector('.result');box.style.display='none';box.textContent=data[1]};el.querySelector('.show').onclick=()=>{if(!data)data=x.g(),el.querySelector('.example').textContent=data[0];let box=el.querySelector('.result');box.textContent='الحل: '+data[1];box.style.display='block'};cards.appendChild(el)})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.sub;activeLesson='';document.getElementById('subjectTitle').textContent=titles[current];chapters();render()});
search.oninput=render;chapters();render();
</script>
